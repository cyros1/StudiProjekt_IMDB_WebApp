{% extends 'base.html' %} 

{% block title %} Signup {% endblock %}
    
{% block main%}
    <br>
    <br>
    <br>
    <br>
    <div class="flex justify-center items-center min-h-screen bg-purple-200">
        <div class="w-full max-w-sm bg-footer-purple p-8 rounded-lg shadow-md">
            <h2 class="text-center text-2xl text-text-white font-semibold mb-6">Sign Up</h2>

            {% if messages %}
            <div class="message-container">
                {% for message in messages %}
                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-text-white">Username:</label>
                    <input type="text" id="username" name="username" class="w-full p-3 bg-f-lighter-purple text-text-white border border-f-border-purple rounded-lg mb-4" placeholder="Enter your username" required>
                </div>
                <div>
                    <label for="email" class="block text-text-white">Email:</label>
                    <input type="email" id="email" name="email" class="w-full p-3 bg-f-lighter-purple text-text-white border border-f-border-purple rounded-lg mb-4" placeholder="Enter your email" required>
                </div>
                <div>
                    <label for="password1" class="block text-text-white">Password:</label>
                    <input type="password" id="password1" name="password1" class="w-full p-3 bg-f-lighter-purple text-text-white border border-f-border-purple rounded-lg mb-4" placeholder="Enter your password" required>
                </div>
                <div>
                    <label for="password2" class="block text-text-white">Confirm Password:</label>
                    <input type="password" id="password2" name="password2" class="w-full p-3 bg-f-lighter-purple text-text-white border border-f-border-purple rounded-lg mb-4" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="w-full bg-submit-button hover:bg-hover-button text-text-white font-semibold py-3 rounded-lg">Sign Up</button>
            </form>
            <div class="text-center mt-4 text-text-white">
                Already have an account? <a href="/login" class="text-hover-button">Login</a>
            </div>
        </div>
    </div>


{% endblock main%}
