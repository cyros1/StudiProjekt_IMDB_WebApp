{% extends 'base.html' %}


        {% load static %}
        <link href="{% static './person_layout.css' %}" rel="stylesheet">
        {% block title %} Regisseur {% endblock title %}

    {% block main %}
    <div class="regisseur-container">
        <h1>Regisseur Name</h1>
        
        <div class="regisseur-details">
            <img src="{% static 'images/danny.png' %}" alt="Bild von Regisseur" class="regisseur-image">
            
            <div class="bio">
                <h2>Biografie</h2>
                <p>Hier steht die Biografie des Regisseurs.</p>
            </div>
        </div>
        
        <h2>Hat diese Filme regissiert:</h2>
        <div class="film-grid">
            <!-- Beispielhafte Film-Div-Elemente -->
            <div class="film-item">Film 1</div>
            <div class="film-item">Film 2</div>
            <div class="film-item">Film 3</div>
            <div class="film-item">Film 4</div>
        </div>
    </div>
    {% endblock main %}
