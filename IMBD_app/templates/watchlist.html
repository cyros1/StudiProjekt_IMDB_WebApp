{% extends 'base.html' %}

{% block title %}My Watchlist{% endblock %}

{% load static %}

{% block main %}
<link rel="stylesheet" href="{% static 'output.css' %}">

<div class="p-6" style="margin-top: 3cm;">
    <h1 class="text-2xl font-bold mb-4">My Watchlist</h1>

    {% if movies %}
        <div class="cards">
            {% for movie in movies %}
            <div class="card">
                <!-- Image -->
                <div class="card-image mb-2">
                    <img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" alt="{{ movie.title }}">
                </div>
                <!-- Movie Title + Description -->
                <div>
                    <p class="card-title">{{ movie.title }}</p>
                    <p class="card-description">Rating: {{ movie.vote_average }}</p>
                </div>
                <!-- Button to Movie Details -->
                <button class="card-button hover:underline"
                    onclick="window.location.href='/movies/{{ movie.id }}'">Show More</button>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-gray-600">Your watchlist is empty.</p>
    {% endif %}
</div>
{% endblock %}
